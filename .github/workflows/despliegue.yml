name: "Terraform Deploy OCI"
on:
    push:
        branches:
        - main
jobs:
    terraform:
        name: "Terraform apply"
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout code
            uses: actions/checkout@v5
    
        -   name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with: 
                terraform_version: "1.7.5"
    
        -   name: Configurar credenciales OCI
            run: |
                mkdir -p ~/.oci
                echo "${{ secrets.OCI_API_KEY_PEM }}" > ~/.oci/oci_api_key.pem
                chmod 600 ~/.oci/oci_api_key.pem
        
        -   name: Terraform Init
            run: terraform init
    
        -   name: Terraform Plan
            run: terraform plan
    
        -   name: Terraform Apply con intentos
            run: |
                for i in {1..5}; do
                    echo "Intento $i de de crear la instancia OCI..."
                    if terraform apply --auto-approve; then
                        echo "Instancia OCI creada exitosamente."
                        exit 0
                    fi
                        echo "Oracle sin capacidad de hosts disponibles, esperando 15 segundos antes de reintentar..."
                        sleep 15
                done
                echo "Error: No se pudo crear la instancia OCI después de 5 intentos."
                exit 1
            env:
                TF_VAR_tenancy_ocid: "${{ secrets.TF_VAR_TENANCY_OCID }}"
                TF_VAR_compartment_ocid: "${{ secrets.TF_VAR_COMPARTMENT_OCID }}"
                TF_VAR_user_ocid: "${{ secrets.TF_VAR_USER_OCID }}"
                TF_VAR_fingerprint: "${{ secrets.TF_VAR_FINGERPRINT }}"
                TF_VAR_region: "${{ secrets.TF_VAR_REGION }}"
                TF_VAR_ubuntu_2404_image_ocid: "${{ secrets.TF_VAR_UBUNTU_2404_IMAGE_OCID }}"
                TF_VAR_ssh_public_key: "${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}"
                TF_VAR_subnet_ocid: "${{ secrets.TF_VAR_SUBNET_OCID }}"
                TF_VAR_availability_domain: "${{ secrets.TF_VAR_AVAILABILITY_DOMAIN }}"
                TF_VAR_private_key_path: "/home/runner/.oci/oci_api_key.pem"

